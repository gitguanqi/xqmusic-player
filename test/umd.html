<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMD / 浏览器全局 —— xqmusic-player</title>
    <link rel="icon" href="./assets/test-icon.svg" type="image/svg+xml">
    <!-- 图标替身：正式用页面里应当引 Font Awesome，但自检页必须能离线跑 -->
    <link rel="stylesheet" href="./assets/icon-shim.css">
    <link rel="stylesheet" href="./assets/demo.css">
    <link rel="stylesheet" href="../lib/css/xqmusic.min.css">
</head>
<body>
    <header class="site">
        <img src="./assets/test-icon.svg" alt="">
        <h1>xqmusic-player · UMD / 浏览器全局</h1>
    </header>

    <nav class="pages">
        <a href="./index.html">索引</a>
        <a href="./umd.html" aria-current="page">UMD / 浏览器全局</a>
        <a href="./esm.html">ESM</a>
        <a href="./vue3.html">Vue 3</a>
    </nav>

    <main>
        <div class="card">
            <h2>自检结果</h2>
            <p class="hint">本页加载的是提交进仓库的压缩产物 <code>lib/js/xqmusic.min.js</code>，用经典 <code>&lt;script&gt;</code> 引入，只依赖全局的 <code>$g</code>（本地替身）。</p>
            <output class="status" id="status" aria-live="polite">检查中…</output>
            <ul class="checks" id="checks"></ul>
        </div>

        <div class="card">
            <h2>可交互 demo</h2>
            <p class="hint">检查跑完后这里必须仍然是一个能播的实例（生命周期断言用的是另一个一次性实例）。</p>
            <div class="demo-row">
                <div class="demo-slot" id="demo"></div>
            </div>
        </div>

        <div class="card">
            <h2>双实例隔离</h2>
            <p class="hint">同一页两个播放器，切歌、静音、歌词互不影响。</p>
            <div class="demo-row">
                <div class="demo-slot" id="demo-a"></div>
                <div class="demo-slot" id="demo-b"></div>
            </div>
        </div>
    </main>

    <!-- 生命周期断言专用的一次性宿主，必须存在于检查脚本之前 -->
    <div id="sandbox" hidden></div>

    <script src="./assets/check-runner.js"></script>
    <script src="./stub/xqgjs-stub.js"></script>
    <script src="../lib/js/xqmusic.min.js"></script>
    <script>
        (function () {
            'use strict';

            var demoInstance = null;
            var pairA = null;
            var pairB = null;
            var songs = [];

            window.XqDemo.setStatus('pending', '检查中…');

            function sleep(ms) {
                return new Promise(function (resolve) { setTimeout(resolve, ms); });
            }

            function waitFor(predicate, timeout) {
                var deadline = Date.now() + (timeout || 2000);
                return new Promise(function (resolve, reject) {
                    (function tick() {
                        if (predicate()) return resolve(true);
                        if (Date.now() > deadline) return reject(new Error('等待超时'));
                        setTimeout(tick, 25);
                    })();
                });
            }

            function host(id) {
                return document.getElementById(id);
            }

            /** 从 mock 拿歌曲数据 */
            function loadSongs() {
                return fetch('./mock/music.json').then(function (res) {
                    return res.json();
                });
            }

            window.XqDemo.check('全局构造器存在', function () {
                return { ok: typeof window.XqMusic === 'function', detail: 'typeof window.XqMusic = ' + typeof window.XqMusic };
            });

            loadSongs().then(function (list) {
                songs = list;

                window.XqDemo.check('构造时注入骨架并解析宿主', function () {
                    demoInstance = new window.XqMusic({ el: '#demo', list: songs, mode: 'slide' });
                    var root = host('demo').querySelector('.xqmusic');
                    return { ok: !!root && root.classList.contains('slide'), detail: 'root=' + !!root };
                });

                window.XqDemo.check('列表渲染 3 首', function () {
                    var items = host('demo').querySelectorAll('.xqmusic-menu-ls li');
                    return { ok: items.length === 3, detail: 'li 数量 = ' + items.length };
                });

                window.XqDemo.check('首曲标题与封面已应用', function () {
                    var title = host('demo').querySelector('.xqmusic-song-title').textContent;
                    var cover = host('demo').querySelector('.xqmusic-cover-img').style.backgroundImage;
                    return { ok: title === '甲 - 第一首' && cover.indexOf('preview.jpg') >= 0, detail: title + ' | ' + cover };
                });

                window.XqDemo.check('播放不抛错（currentTime 为 0 的历史崩溃点）', async function () {
                    demoInstance.playSong();
                    await sleep(50);
                    var width = host('demo').querySelector('.xqmusic-progress-bar').style.width;
                    return { ok: demoInstance.playStatus === true && width === '0%', detail: 'playStatus=' + demoInstance.playStatus + ' width=' + width };
                });

                window.XqDemo.check('歌词加载并渲染', async function () {
                    await waitFor(function () {
                        return host('demo').querySelectorAll('.xqmusic-lyric-ls li').length >= 4;
                    });
                    var lines = host('demo').querySelectorAll('.xqmusic-lyric-ls li');
                    return { ok: lines.length === 4 && lines[0].textContent === '这是第一行歌词', detail: 'lines=' + lines.length + ' first=' + lines[0].textContent };
                });

                window.XqDemo.check('切歌后标题与歌词都切换', async function () {
                    demoInstance.toggleNextSong();
                    await waitFor(function () {
                        return host('demo').querySelector('.xqmusic-song-title').textContent === '乙 - 第二首';
                    });
                    // 歌词是异步拉的：等到第二首的第一行真的出现，而不是读完标题就断言
                    await waitFor(function () {
                        var li = host('demo').querySelector('.xqmusic-lyric-ls li');
                        return li && li.textContent === '第二首的第一行';
                    });
                    var title = host('demo').querySelector('.xqmusic-song-title').textContent;
                    var first = host('demo').querySelector('.xqmusic-lyric-ls li');
                    return { ok: title === '乙 - 第二首' && first.textContent === '第二首的第一行', detail: title + ' | ' + first.textContent };
                });

                window.XqDemo.check('无歌词歌曲降级为空态且不抛错', async function () {
                    demoInstance.currentIndex = 2;
                    demoInstance.toggleMusic();
                    await sleep(80);
                    var box = host('demo').querySelector('.xqmusic-lyric-ls');
                    return { ok: box.textContent.indexOf('暂无歌词') >= 0, detail: box.textContent.trim() };
                });

                window.XqDemo.check('静音按钮切换真实 muted 状态', function () {
                    var before = demoInstance.xqAudio.muted;
                    demoInstance.setMuted(true);
                    var muted = demoInstance.xqAudio.muted;
                    demoInstance.setMuted(false);
                    return { ok: before === false && muted === true && demoInstance.xqAudio.muted === false, detail: 'muted 切换 → ' + muted };
                });

                window.XqDemo.check('生命周期：destroy 解绑全部监听并移除节点', function () {
                    var probe = new window.XqMusic({ el: '#sandbox', list: songs });
                    var count = probe._handlers.length;
                    probe.destroy();
                    var removed = host('sandbox').querySelector('.xqmusic');
                    return { ok: count === 10 && probe._handlers.length === 0 && !removed, detail: '监听 ' + count + ' 个 → 0，节点移除=' + !removed };
                });

                window.XqDemo.check('多实例互不干扰', function () {
                    pairA = new window.XqMusic({ el: '#demo-a', list: songs });
                    pairB = new window.XqMusic({ el: '#demo-b', list: songs });
                    pairA.setMuted(true);
                    var titleA = host('demo-a').querySelector('.xqmusic-song-title').textContent;
                    var titleB = host('demo-b').querySelector('.xqmusic-song-title').textContent;
                    var mutedB = pairB.xqMuted.classList.contains('active');
                    return { ok: titleA === titleB && mutedB === false, detail: 'mutedB=' + mutedB };
                });

                // 收尾：把主页面的实例恢复成一首能播的歌，再报告
                window.XqDemo.report({
                    remount: function () {
                        demoInstance.currentIndex = 0;
                        demoInstance.toggleMusic();
                        demoInstance.setMuted(false);
                    },
                    liveCount: function () {
                        return document.querySelectorAll('.xqmusic .xqmusic-audio').length;
                    },
                });
            }, function (err) {
                window.XqDemo.check('加载 mock 数据', function () {
                    throw err;
                });
                window.XqDemo.report();
            });
        })();
    </script>
</body>
</html>
